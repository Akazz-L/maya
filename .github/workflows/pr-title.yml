name: PR title

on:
  pull_request:
    # `edited` re-runs the check when the title is fixed; `synchronize` keeps a
    # fresh result on the head commit so branch protection stays satisfied.
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional commit format
    runs-on: ubuntu-latest
    steps:
      # PRs are squash-merged, so the PR title becomes the commit subject on
      # main — validating it here is what keeps the history conventional.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
