name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run for that PR obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails the build if uv.lock has drifted from pyproject.toml
      # rather than silently resolving something else.
      - name: Install dependencies
        run: uv sync --locked

      # tests/conftest.py defaults JWT_SECRET and DATABASE_URL (in-memory
      # SQLite), so the suite needs no secrets and no live database.
      - name: Run pytest
        run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run vitest
        run: npm run test
